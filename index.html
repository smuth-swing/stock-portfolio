<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="주식 체크 리스트 전용 뷰어">
    <title>주식 체크 리스트 — 전용 뷰어</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header id="app-header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-title">Stock Checklist</span>
                    <span class="logo-subtitle">주식 체크 리스트 뷰어</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div id="connection-status" class="connection-badge disconnected">
                <span class="status-dot"></span>
                <span class="status-text">연결 중...</span>
            </div>
            <button id="btn-refresh" class="header-btn" title="새로고침" onclick="refreshData()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>
            </button>
        </div>
    </header>

    <main id="app-main">
        <!-- 파일 선택 섹션 제거, 현재 파일 표시만 유지 -->
        <div class="fixed-file-indicator glass-panel-sm">
            <div class="indicator-content">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="color: var(--gold-primary);">
                    <path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/>
                </svg>
                <span class="label">고정 파일:</span>
                <span class="filename">주식 체크 리스트_20220328.xlsx</span>
                <span id="row-count-badge" class="badge">0행</span>
            </div>
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="table-search" placeholder="데이터 검색..." oninput="filterTable()">
            </div>
        </div>

        <section id="dashboard" class="dashboard">
            <div class="viewer-header glass-panel">
                <div class="sheet-tabs-container">
                    <div id="sheet-tabs" class="sheet-tabs">
                        <!-- 시트 탭이 여기에 생성됨 -->
                    </div>
                </div>
            </div>

            <div class="table-panel glass-panel">
                <div class="table-wrapper">
                    <table id="data-table">
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 로딩 오버레이 -->
        <div id="loading-overlay" class="loading-overlay">
            <div class="spinner"></div>
            <p>데이터를 불러오는 중입니다...</p>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
