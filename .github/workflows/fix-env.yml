name: Fix Pages Environment

on:
  workflow_dispatch:

permissions:
  administration: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Delete github-pages environment
        run: |
          curl -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/smuth-swing/stock-portfolio/environments/github-pages
