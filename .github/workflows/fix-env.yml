name: Fix Pages Environment

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Delete github-pages environment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: 'smuth-swing',
                repo: 'stock-portfolio',
                environment_name: 'github-pages'
              });
              console.log('✅ Environment deleted successfully');
            } catch (e) {
              console.log('Delete failed:', e.message);
              // Try to update instead - remove protection rules
              try {
                await github.rest.repos.createOrUpdateAnEnvironment({
                  owner: 'smuth-swing',
                  repo: 'stock-portfolio',
                  environment_name: 'github-pages',
                  protection_rules: []
                });
                console.log('✅ Protection rules cleared');
              } catch (e2) {
                console.log('Update also failed:', e2.message);
              }
            }
